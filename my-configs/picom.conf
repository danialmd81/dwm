###############################################################################
# RENDERING & BACKEND
###############################################################################
backend = "glx";
vsync = true;

# Prevents status bar (dwmblocks/dmenu) flickering on GLX/NVIDIA
use-damage = false;

# Required on hybrid GPU setups to avoid screen tearing when switching workspaces
unredir-if-possible = false;

###############################################################################
# SHADOWS (DISABLED)
###############################################################################
shadow = false;

###############################################################################
# FADING (DISABLED)
###############################################################################
fading = false;

###############################################################################
# OPACITY & BLUR
###############################################################################
# Keep windows fully opaque by default
active-opacity = 1.0;
inactive-opacity = 1.0;

# Explicitly override Dunst window opacity to 100%
opacity-rule = [
  "100:class_g = 'Dunst'",
  "100:class_i = 'dunst'"
];

# Preserve transparency settings requested by terminals (kitty, alacritty, etc.)
detect-client-opacity = true;

# Prevent focus/dim rules from affecting Dunst
focus-exclude = [
  "class_g = 'Dunst'"
];

###############################################################################
# DWM & NOTIFICATION WINDOW TYPES OVERRIDES
###############################################################################
wintypes:
{
  tooltip       = { fade = false; shadow = false; opacity = 0.95; focus = true; };
  dock          = { shadow = false; fade = false; };
  dmenu         = { shadow = false; fade = false; };
  popup_menu    = { opacity = 0.95; shadow = false; fade = false; };
  dropdown_menu = { opacity = 0.95; shadow = false; fade = false; };
  notification  = { opacity = 1.0; shadow = false; fade = false; focus = true; };
};