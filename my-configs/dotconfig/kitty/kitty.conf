# --- Default Foreground & Background ---
foreground            #bbbbbb
background            #222222

# --- Cursor Colors ---
cursor                #add8e6
cursor_text_color     #222222

# --- Selection Colors ---
selection_foreground  #bbbbbb
selection_background  #555555

# --- 16 Standard ANSI Colors ---

# Black
color0  #000000
color8  #7f7f7f

# Red (red3 / bright red)
color1  #cd0000
color9  #ff0000

# Green (green3 / bright green)
color2  #00cd00
color10 #00ff00

# Yellow (yellow3 / bright yellow)
color3  #cdcd00
color11 #ffff00

# Blue (blue2 / bright blue)
color4  #0000ee
color12 #5c5cff

# Magenta (magenta3 / bright magenta)
color5  #cd00cd
color13 #ff00ff

# Cyan (cyan3 / bright cyan)
color6  #00cdcd
color14 #00ffff

# White (gray90 / bright white)
color7  #e5e5e5
color15 #ffffff

# --- Fonts ---
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# --- Fallback / Secondary Fonts ---
# Automatically handles Vazirmatn, JetBrainsMono, and Font Awesome if installed on your system.
# Enable emoji support via Noto Color Emoji:
symbol_map U+1F300-U+1F9FF Noto Color Emoji

# --- Tilix Style Tab Shortcuts ---

# New tab (opens in current working directory)
map ctrl+shift+t        new_tab_with_cwd

# Close tab
map ctrl+shift+w        close_tab

# Move between tabs (Tilix style)
map ctrl+page_up        previous_tab
map ctrl+page_down      next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+right    next_tab

# Jump to specific tab (Alt + 1..9)
map alt+1               goto_tab 1
map alt+2               goto_tab 2
map alt+3               goto_tab 3
map alt+4               goto_tab 4
map alt+5               goto_tab 5
map alt+6               goto_tab 6
map alt+7               goto_tab 7
map alt+8               goto_tab 8
map alt+9               goto_tab 9

# --- Split Layout Engine ---
# Enables Kitty's split layout engine
enabled_layouts splits

# --- Tilix Auto-Split Shortcut ---
# Automatically splits right (if wider) or down (if taller)
map ctrl+alt+a launch --location=split --cwd=current

# Navigate between split panes (Alt + Arrow Keys)
map alt+left            neighboring_window left
map alt+right           neighboring_window right
map alt+up              neighboring_window up
map alt+down            neighboring_window down

# Resize split panes (Ctrl + Alt + Arrow Keys)
map ctrl+alt+left       resize_window narrower 3
map ctrl+alt+right      resize_window wider 3
map ctrl+alt+up         resize_window taller 3
map ctrl+alt+down       resize_window shorter 3

# Disable Kitty font size shortcuts
map ctrl+shift+equal unbind
map ctrl+shift+plus  unbind
map ctrl+shift+minus unbind
map ctrl+shift+backspace unbind