###############################################################################
# BACKEND & COMPOSITING (CROSS-GPU SAFE)
###############################################################################
backend = "glx";
vsync = true;
use-damage = true;
xrender-sync-fence = true;

# Do not unredirect fullscreen windows globally (avoids PRIME/hybrid flickering)
unredir-if-possible = false;

###############################################################################
# WINDOW & FOCUS DETECTION
###############################################################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;

###############################################################################
# SHADOWS & FADING (DISABLED)
###############################################################################
shadow = false;
fading = false;

###############################################################################
# OPACITY
###############################################################################
active-opacity = 1.0;
inactive-opacity = 1.0;

opacity-rule = [
  "100:class_g = 'dwm'",
  "100:class_g = 'dwmsbar'",
  "100:class_g = 'dmenu'",
  "100:class_g = 'Dunst'"
];